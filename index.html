<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<meta name="description" content="Guandulcitas Big Adventure — Richard Quinto Weber Fall 2027 transfer campus visits">
<title>Guandulcitas Big Adventure</title>
<style>
:root{--navy:#102a43;--blue:#2878c8;--sky:#eaf4ff;--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#66737f;--line:#dbe3ea;--warn:#fff4d6;--green:#e9f7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}header{background:linear-gradient(135deg,#102a43,#205d88);color:#fff;padding:22px 18px 20px;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #0002}header h1{font-size:23px;margin:0 0 4px}header p{margin:0;font-size:13px;opacity:.88}main{max-width:780px;margin:auto;padding:13px 12px 40px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.nav button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px 4px 8px;font-weight:800;font-size:11px;color:var(--text);box-shadow:0 1px 4px #0000000a}.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.ico{width:29px;height:29px;display:block;margin:0 auto 4px}.nav button.active .ico{filter:brightness(0) invert(1)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 2px 7px #00000008}.title{font-weight:850;font-size:16px}.small{font-size:13px;color:var(--muted);line-height:1.48}h2{font-size:20px;margin:6px 0 12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tag{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#e9eef3;color:#334;white-space:nowrap}.priority{background:var(--warn);border-color:#efd48c}.good{background:var(--green)}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.school{width:100%;text-align:left;border:0;background:transparent;padding:0;color:inherit}.time{font-weight:850;font-size:13px;color:var(--blue)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.notice{padding:12px;border-radius:13px;background:var(--sky);border:1px solid #cfe0f7;font-size:13px;line-height:1.45}.hero{border-radius:17px;padding:17px;background:linear-gradient(135deg,#dff1ff,#fff);border:1px solid #c9e1f5;margin-bottom:12px}.heroart{width:100%;height:90px;display:block;margin-bottom:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions a{display:inline-block;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 11px;border-radius:10px;font-size:12px;font-weight:700}footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}@media(min-width:600px){.nav{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header><h1>🌴 Guandulcitas Big Adventure</h1><p>Richard “Quinto” Weber · Fall 2027 Transfer Campus Visits · Oct 7–10, 2026</p></header>
<main><div class="nav" id="nav"></div><div id="app"></div></main>
<footer>Stakeholder itinerary · Bookmark this page for the latest version.</footer>
<script>
const icons={
overview:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.7"><path d="M6 18 20 7l14 11v15H24v-9h-8v9H6z"/><path d="M27 10V5h5v9"/></svg>',
days:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.7"><rect x="6" y="8" width="28" height="27" rx="4"/><path d="M6 15h28M12 5v7M28 5v7M12 21h5M21 21h7M12 27h5"/></svg>',
flights:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m7 29 25-18c3-2 5 1 2 3L10 32z"/><path d="m17 22-5-11 3-2 9 8M21 25l7 4"/></svg>',
hotels:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 33V8h28v25M6 25h28"/><path d="M10 25v-7h7a4 4 0 0 1 4 4v3M23 25v-5h7"/></svg>',
cars:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m8 24 3-10h18l3 10v7H8zM11 24h18M13 18h14"/><circle cx="13" cy="31" r="2.5"/><circle cx="27" cy="31" r="2.5"/></svg>',
schools:'<svg class="ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m4 16 16-9 16 9-16 9z"/><path d="M9 20v9c5 4 17 4 22 0v-9M20 25v9M32 18v10"/></svg>'};
const flights=[["Wed Oct 7","AA 299","MXP → PHL","2:20 PM → 5:20 PM","Papa","FUHCIK"],["Wed Oct 7","AA 1992","PHL → JAX","8:46 PM → 11:07 PM","Papa","FUHCIK"],["Wed Oct 7","AA 716","ORD → JAX","7:20 PM → 10:49 PM","Quinto","IOCHVE"],["Fri Oct 9","AA 1982","TPA → CLT","5:22 PM → 7:13 PM","Both","NITFMC"],["Fri Oct 9","AA 1085","CLT → MYR","9:02 PM → 10:02 PM","Both","NITFMC"],["Sat Oct 10","UA 3402","MYR → ORD","4:44 PM → 6:20 PM","Both","D3PYC8"]];
const hotels=[["Oct 7–8","Holiday Inn Express Jacksonville","Jacksonville","UNF / Flagler"],["Oct 8–9","Hyatt House Tampa Downtown","Tampa","UTampa / USF"],["Oct 9–10","Fairfield by Marriott Inn & Suites Coastal Carolina Conway","Conway","CCU"],["Oct 10–12","Renaissance Chicago Glenview Suites","Glenview","After ORD arrival"]];
const cars=[["Oct 7","National","JAX Airport","11:30 PM pickup","Return before TPA flight"],["Oct 9","National","Myrtle Beach Airport","10:30 PM pickup","Return about 3:40 PM Oct 10"],["Oct 10","National","ORD","7:00 PM pickup","Return Oct 12 by 7:00 PM"]];
const schools=[["UNF","University of North Florida","Thu Oct 8","10:00 AM–12:00 PM","Housing + Business Management","Leave ~12:15 PM"],["Flagler","Flagler College","Thu Oct 8","1:30–3:30 PM","Business + Housing","Housing must be verified"],["UTampa","University of Tampa","Fri Oct 9","9:30–11:30 AM","Business Management + Housing","Leave ~12:10 PM"],["USF","University of South Florida","Fri Oct 9","12:30–1:45 PM","Housing + Muma Business","Self-guided; leave ~1:45 PM"],["CCU","Coastal Carolina University","Sat Oct 10","10:00 AM–12:00 PM","Housing + Wall College","Deepest overall evaluation"]];
const days=[["Wed Oct 7","Travel to Jacksonville","Papa: MXP→PHL→JAX. Quinto: ORD→JAX. National pickup. Holiday Inn Express."],["Thu Oct 8","UNF + Flagler","10:00–12:00 UNF. 1:30–3:30 Flagler. Tampa overnight."],["Fri Oct 9","UTampa + USF + Myrtle Beach","9:30–11:30 UTampa. 12:30–1:45 USF. 5:22 PM TPA→CLT; 9:02 PM CLT→MYR."],["Sat Oct 10","CCU + ORD","10:00–12:00 CCU. Rental return ~3:40 PM. 4:44 PM MYR→ORD."]];
let active="overview";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const card=x=>'<div class="card">'+x+'</div>';
function render(){
document.getElementById("nav").innerHTML=["overview","days","flights","hotels","cars","schools"].map(x=>'<button class="'+(active===x?"active":"")+'" data-tab="'+x+'">'+icons[x]+x[0].toUpperCase()+x.slice(1)+'</button>').join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});
let h="";
if(active==="overview")h='<div class="hero"><svg class="heroart" viewBox="0 0 600 100" fill="none"><path d="M0 76Q120 30 240 70T480 58T600 66v34H0z" fill="#9ed6b7"/><path d="M0 83Q130 48 260 79t340-5v26H0z" fill="#78bfe3"/><path d="M65 70q10-32 24-48M78 69q-6-25-22-38M81 62q20-20 38-25M78 49q-1-20 5-34" stroke="#2b6b4f" stroke-width="6" stroke-linecap="round"/><path d="M500 73q9-30 23-48M512 72q-6-24-21-37M515 63q19-19 36-24M512 49q0-19 6-32" stroke="#2b6b4f" stroke-width="6" stroke-linecap="round"/><circle cx="455" cy="22" r="13" fill="#f6c85f"/></svg><div class="title">Five campuses. Four days. One big adventure.</div><div class="small">A bite-size dashboard for flights, hotels, cars, school visits and the most important question: can Quinto realistically get on-campus housing as a junior transfer?</div></div>'+card('<div class="notice"><b>🏠 Housing is the #1 go/no-go item.</b><br>At every school, verify that a Fall 2027 junior transfer entering with approximately 60+ credits can realistically obtain on-campus housing.</div>')+card('<div class="title">Campus sequence</div><div class="list" style="margin-top:10px">'+schools.map((s,i)=>'<button class="item school" onclick="showSchool('+i+')"><div class="row"><div><b>'+s[0]+'</b><div class="small">'+s[1]+'</div></div><span class="tag">'+s[2]+'</span></div><div class="small" style="margin-top:6px">'+s[3]+' · '+s[4]+'</div></button>').join("")+'</div>')+card('<div class="title">Critical checkpoints</div><div class="small" style="margin-top:8px">Thu: leave UNF ~12:15 PM · Flagler after 3:30 PM only if housing discussion permits.<br>Fri: leave UTampa ~12:10 PM · USF 12:30–1:45 PM · TPA flight 5:22 PM.<br>Sat: CCU 10:00 AM–12:00 PM · return MYR rental ~3:40 PM · flight 4:44 PM.</div>');
if(active==="days")h="<h2>Days</h2>"+days.map(d=>card('<div class="time">'+d[0]+'</div><div class="title">'+d[1]+'</div><div class="small" style="margin-top:6px">'+d[2]+'</div>')).join("");
if(active==="flights")h="<h2>Flights</h2>"+flights.map(f=>card('<div class="row"><div><div class="title">'+f[1]+' · '+f[2]+'</div><div class="small">'+f[3]+' · '+f[4]+'</div></div><span class="tag">'+f[0]+'</span></div><div class="mono" style="margin-top:8px">Confirmation: '+f[5]+'</div>')).join("");
if(active==="hotels")h="<h2>Hotels</h2>"+hotels.map(x=>card('<div class="title">🏨 '+x[1]+'</div><div class="small">'+x[0]+' · '+x[2]+'</div><div class="small">Purpose: '+x[3]+'</div>')).join("");
if(active==="cars")h="<h2>Rental Cars</h2>"+cars.map(x=>card('<div class="row"><div><div class="title">🚗 '+x[1]+' · '+x[2]+'</div><div class="small">'+x[3]+'</div></div><span class="tag">'+x[0]+'</span></div><div class="small" style="margin-top:7px">'+x[4]+'</div>')).join("");
if(active==="schools")h="<h2>Schools</h2>"+schools.map((s,i)=>card('<button class="school" onclick="showSchool('+i+')"><div class="row"><div><div class="title">🎓 '+s[0]+' — '+s[1]+'</div><div class="small">'+s[2]+' · '+s[3]+'</div></div><span class="tag">Open</span></div><div class="small" style="margin-top:7px"><b>Focus:</b> '+s[4]+'<br><b>Timing:</b> '+s[5]+'</div></button>')).join("");
document.getElementById("app").innerHTML=h;
}
function showSchool(i){const s=schools[i];document.getElementById("app").innerHTML='<button onclick="active=\'schools\';render()" style="border:0;background:none;padding:8px 0;color:var(--blue);font-weight:800">← All schools</button><h2>'+s[1]+'</h2>'+card('<div class="time">'+s[2]+' · '+s[3]+'</div><div class="title" style="margin-top:8px">'+s[4]+'</div>')+card('<div class="title">🏠 Housing — non-negotiable</div><div class="small" style="margin-top:7px">Ask: Is housing realistically available to a new junior transfer with ~60+ credits? What is the priority? Is there a waitlist? Which communities and room types are realistic? What are the application/deposit deadlines?</div>')+card('<div class="title">🎓 Business Management</div><div class="small" style="margin-top:7px">Ask how the Oakton AA transfers, the fastest path to graduation, Management/Analytics options, entrepreneurship, internships and career preparation.</div>')+card('<div class="title">💼 Investment — optional</div><div class="small" style="margin-top:7px">Investment is an interest rather than the intended major. Explore clubs/funds only if time remains after housing, academics and career questions.</div>')+card('<div class="title">Leave-by target</div><div class="small" style="margin-top:7px">'+s[5]+'</div>')}
render();
</script>
</body>
</html>
